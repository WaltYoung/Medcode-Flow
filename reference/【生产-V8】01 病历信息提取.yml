            \n# [信源归属强制准则]（判定集合归属的唯一标准）：\n物理隔离原则：仅当信息位于明确标识为“XX报告”、“XX诊断”、“XX检查结果”等独立检查章节标题下时，方可计入对应的【手术】、【病理】、【影像】、【内镜】集合。\n\
