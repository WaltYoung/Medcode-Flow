            \ [手术：未明确提及]\n\n3.病理报告提取要求（仅限独立病理报告章节）：\n- 准入条件：必须源自独立的“病理检查”文档，禁止从现病史中提取。\n\
            - 仅提取病理诊断结论中疾病名称体现出的亚部位\n- 强制屏蔽（黑名单），严禁提取以下非肿瘤中心部位：\n    - 切缘部位：凡是带有“切缘”、“黏膜切缘”、“离断端”字样的部位\n\
            \    - 阴性部位：凡是描述为“未见癌”、“未见累及”、“阴性”的部位\n    - 附属/清扫部位：凡是描述为“组淋巴结”、“软组织”、“肌肉”等非原发器官亚部位\n\
            \   -  针对宫颈，严禁提取方位度数词：如“1点”、“12点”、“3-6点”、“宫颈1°”、“宫颈I度”等。\n  -  强制屏蔽手术范围词：若括号内出现‘全胃’、‘全子宫’、‘全食管’、‘XX切除标本’，一律视为标本范围，禁止提取为病灶亚部位\n\
            \n\n- 示例判定：\n    - 原文：（右侧声门下）中分化鳞癌；会厌切缘未见癌 -> 仅提取：右侧声门下\n    - 原文：胃体小弯侧腺癌，胃窦切缘阴性\
            \ -> 仅提取：胃体\n    - **触发词**：当病理诊断包含 **印戒细胞癌、皮革胃、弥漫浸润型、硬癌** 时。\n    - **连锁反应**：强制将\
            \ **[影像]** 和 **[内镜]** 中的“壁增厚/水肿/浸润范围”识别为**非原发蔓延**，**严禁**将此类描述提取为亚部位。\n\
            \n\n4.影像报告提取规则（仅限独立影像报告章节）\n- 准入条件：必须源自独立的“CT/MRI/超声/PET-CT”等影像报告标题下，禁止从现病史中提取。\n\
            - **核心指令**：解析影像报告中的[影像表现/意见]，**必须**经过以下两步过滤才能输出：\n    - 第一步：词频清洗\n   \
            \     - 在提取前，强制删除诊断结论中所有包含 **增厚、受侵、模糊、淋巴结、积液、扩张、欠佳、显示、可见** 的句子片段。\n  \
            \      - **清洗后**，从剩余纯描述中寻找部位词。\n    - 第二步：输出清洗后的结果\n- 判定示例：\n    - 输入：影像写“胃体胃底壁增厚”。\n\
            \    - 输出：影像：胃体胃底\n\n5. 内镜报告提取规则（仅限独立内镜报告章节）：\n- 硬性拦截：若文本位于【现病史】、【主诉】、【入院记录】或【其他医院病史摘要】段落中，必须强制忽略，严禁跨章节采样。\n\
            - 准入条件：必须源自内镜报告标题下，禁止从现病史中提取。\n- **提取源**：仅提取“内镜报告”中**镜下诊断**或**活检定位**描述中的部位。\n\
            - **取实原则**：提取描述**黏膜病变基底/中心**的部位。若描述为“XX侧向YY延伸”，提取**XX**作为主部位。\n\n# 输出：\n\
            1.注意事项：禁止输出其他说明和解释，必须按照输出格式输出；\n2.自检：\n- **无效词清洗检查**：确保提取项中**不含**任何“增厚”、“侵犯”、“水肿”等修饰词。\n\
            - 确保【手术】、【病理】、【影像】、【内镜】四个集合内不包含来自《现病史》或《入院记录》的信息。\n3.输出格式：\n---\n### [病灶编号：1/2/...]\n\
            提取集合：\n- 是否有手术记录：[是/否]\n- 手术：[仅限独立手术报告提取，否则显示未提及]\n- 病理：[仅限独立病理报告提取，否则显示未提及]\n\
            - 影像：[仅限独立影像报告提取，否则显示未提及，输出提取的原文]\n   - [报告类型：XX亚部位]\n- 内镜：[仅限独立内镜报告提取，否则显示未提及，输出提取的原文]\n\
            \   - [报告类型：XX亚部位]\n- 临床：[本次住院是否已明确亚部位，若已明确，则显示未提及且其下方不输出任何原文片段]\n   -\
            \ [XX章节类型：XX亚部位。]\n---"
