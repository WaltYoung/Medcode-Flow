            - **解剖独立性**：成对器官（肺、乳腺、甲状腺、肾、卵巢、肾上腺等）的左右侧病灶，视为独立病灶。\n- **空间独立性**：同一器官内，位置不连续、有正常组织间隔的多个肿块，视为独立病灶（例如：胃底和胃窦的两个独立早期癌）。\n\
