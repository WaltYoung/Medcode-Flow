            若无任何手术类文档，以【病理】定性为主，【影像】定量为辅。\n- 原则 5：病理采样锚点原则\n    - 核心逻辑：【具体解剖亚部位】必须以【病理】的定性确证为基石，以【内镜】的直视观察为范围边界。影像学的扩张性描述（如：侵犯、累及）若无内镜或病理支撑，视为“高估”并予以剔除。\n\
