            \ 1，须注明：触发共识熔断，包括剔除了哪些孤证或阴性切缘位点]\n- 最终选取的章节：[说明剔除的离群孤证章节 并 说明最终选取的章节]\n\
            \    - 触发共识熔断（原则1）：若触发则说明票数和理由（注意 【病理报告】中孤证必须保留）\n    - 原则2（范围向下兼容）\n\
