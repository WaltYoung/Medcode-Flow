            \ 4。不能将已经被原则 1 判定为“噪声”的部位通过本原则重新引入。\n- 逻辑： 若不同报告提到的部位不一致但解剖相邻（如胃角 vs 胃体），禁止二选一，应视为该病变跨越了交界区域。\n\
