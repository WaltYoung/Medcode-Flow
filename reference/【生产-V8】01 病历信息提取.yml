          \        if len(row) != len(headers):\n            # 如果列数不匹配，用空字符串填充缺少的列\n\
          \            row = row + [\"\"] * (len(headers) - len(row))\n        data_row\
          \ = \"| \" + \" | \".join(row) + \" |\"\n        data_rows.append(data_row)\n\
          \n    # 组合所有行\n    markdown_table = header_row + \"\\n\" + separator_row\n\
