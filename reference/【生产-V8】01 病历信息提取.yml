            \n    **5.2 权力下放后的裁决逻辑**\n    - 触发条件：当 5.1 判定病理锚点失效时\n    - 执行动作：\n  \
            \      - 路径 A：若【内镜】有效（有具体亚部位），以【内镜】为最高裁决依据。\n        - 路径 B：若【内镜】缺位或无效，**以【影像】提取项为直接裁决依据**，**严禁**引用原则\
            \ 5 对影像进行收减。\n\n    **5.3 影像有效时的常规收减（仅在病理有效时且不病理不是未提及时触发）**\n    情况1：病理精准位点穿透\n\
            \    - 指令：若【病理】位点属于【内镜/影像】描述位点的深层亚部位（如病理：声门下 vs 内镜：声带）或具体分支，必须强制采信【病理】位点并结束后面判断；\n\
