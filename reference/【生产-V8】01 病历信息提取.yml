            \  - 处理：合并提取。\n  - 示例：“（胃体、胃窦）腺癌” → 提取：胃体、胃窦。\n\n\n# 亚部位提取标准化：\n## 1.【宫颈】：宫颈判断仅支持以下规则，禁止根据临床语义理解\n\
