            \ 病理分级：\"高分化\"、\"中分化\"、\"低分化\"\n \n### 3.3 保留项\n保留以下编码必需信息：\n1. 解剖部位（包括侧别和具体位置）\n\
            2. ICD明确区分的病理类型（如：\"浸润性导管癌\"、\"鳞状细胞癌\"）\n\n## 第四阶段：诊断分类与首要关键词生成\n目的：判断诊断类型并生成第一个关键词\n\
            \n### 4.1 诊断类型判断\n- A类（治疗性/状态性）：包含\"术后\"、\"化疗后\"、\"治疗后\"等关键词\n- B类（随诊检查）：【主要诊断名称】含有“随诊”等关键字\n\
            - C类（疾病本体）：不符合A类、B类的所有疾病诊断\n \n### 4.2 关键词1生成规则\n- A类诊断：关键词1 = 基准诊断完整原始描述\n\
            - B类诊断：关键词1 = 随诊检查（禁止输出具体的疾病名称）\n- C类诊断：关键词1 = 标准化后的净化疾病名称\n---\n \n##\
            \ 第五阶段：系统识别与特征提取\n【本步骤执行前提】：仅当第四阶段的输出结果为 A类或C类 时才执行本步骤。\n【排除情况】：若第四阶段输出结果属于A类中的抗肿瘤治疗（即化疗、放疗、靶向、免疫、同位素治疗、维持治疗），或者B类随诊检查时跳过本步骤，进行第六步骤\n\
            目的：根据标准化诊断识别ICD大类，提取系统特异性特征。\n \n### 5.1 ICD大类识别表\n根据标准化诊断中的关键词识别所属系统：\n\
