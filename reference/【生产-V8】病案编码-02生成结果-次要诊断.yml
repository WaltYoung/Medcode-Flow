    - data:
        code: "import json\nimport re\n\ndef extract_think_and_json(text:str):\n \
          \   \"\"\"\n    从文本中提取 think 部分和 JSON 部分\n    \n    Args:\n        text:\
          \ 包含 <think> 和 ```json``` 的文本字符串\n        \n    Returns:\n        dict:\
          \ 包含 think_text 和 json_content 的字典\n        {\n            'think_text':\
          \ str,  # think 标签中的文本内容\n            'json_content': dict/list  # 解析后的\
          \ JSON 对象\n        }\n    \"\"\"\n\n    result = {\n        'think_text':\
          \ '',\n        'json_content': []\n    }\n    \n    # 提取 think 部分 - 使用正则匹配\
          \ <think> 和 </think> 之间的内容\n    think_pattern = r'<think>(.*?)</think>'\n\
          \    think_match = re.search(think_pattern, text, re.DOTALL)\n    \n   \
          \ if think_match:\n        result['think_text'] = think_match.group(1).strip()\n\
          \    \n     # 方法1：尝试匹配代码块\n    json_patterns = [\n        r'```json\\s*([\\\
          s\\S]*?)\\s*```',  # 标准 json 代码块\n        r'```\\s*([\\s\\S]*?)\\s*```',\
          \      # 任何代码块\n        r'(\\[\\s*\\{[\\s\\S]*?\\}\\s*\\])',    # 直接匹配 JSON\
          \ 数组\n    ]\n    \n    json_str = None\n    for pattern in json_patterns:\n\
          \        match = re.search(pattern, text, re.DOTALL)\n        if match:\n\
          \            json_str = match.group(1).strip()\n            try:\n     \
          \           # 将 JSON 字符串解析为 Python 对象\n                result['json_content']\
          \ = json.loads(json_str)\n            except json.JSONDecodeError as e:\n\
          \                print(f\"JSON 解析错误: {e}\")\n            break\n    \n \
          \   \n    return result\n\n\ndef main(cyzd_text: str) -> dict:\n    cyzd\
          \ = extract_think_and_json(cyzd_text)['json_content']\n    \n    return\
          \ {\n        \"cyzd\":json.dumps(cyzd,ensure_ascii = False)\n    }"
