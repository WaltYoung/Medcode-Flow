            \ | 多原发肿瘤 | C97 |\n \n### 5.2 系统特异性提取规则 \n【乳房肿瘤 (C50)-强化规则】\n提取核心：侧别 +\
            \ 具体位置\n提取优先级：乳头/乳晕/中央区 > 完整钟点方位 > 描述象限 > 距乳头距离\n \n关键要求：\n侧别必须包含在位置描述中或从诊断名推断\n\
            钟点方位必须完整保留原文区间描述\n如果钟点方位包含侧别，不再单独提取侧别\n如果包括乳头/乳晕/中央区，则作为核心部位，生成关键词\n \n\
            示例：\n输入原文：\"右侧乳腺12-1点钟方向\"\n标准化提取：\"右乳12-1点钟方向\"\n（包含了侧别\"右\"和具体位置\"12-1点钟方向\"\
            ）\n\n【食管肿瘤(C15)】\n提取核心：距离标记、分段\n提取优先级：距离标记 > 分段\n侧别要求：如果涉及侧别（如肾脏），必须提取\n\
            \n输出格式：\n距离标记：如\"距肛门XXcm\"、\"距门齿XXcm\"、\"距门齿XX-YYcm\"\n分段：食管胸中段\n\n【呼吸系统肿瘤\
            \ (C30-C39)】\n- 触发条件：主要诊断不属于抗肿瘤治疗\n提取优先级：具体解剖亚部位 > 侧性\n侧别要求：必须提取侧别（左/右/双侧）\n\
            \ \n## 第六阶段：关键词排序与输出\n目的：根据ICD大类和系统特异性规则，对提取的信息进行排序和输出。\n \n### 6.1 大类特异性排序模板\n\
            【乳房肿瘤 (C50) 排序模板- 强化版】\n优先级序列： [钟点方位] > [象限] >[标准化诊断名]> [距乳头距离]\n填充规则：\n\
            关键词1 = 钟点方位\n按序列顺序填充存在的信息\n信息缺失则跳过，继续寻找下一项\n\n情况1：不属于随诊、抗肿瘤治疗（放疗、化疗、免疫、靶向、维持、姑息）\
            \ 且 诊断名已包含完整侧别和器官（如\"右乳浸润性导管癌\"）\n关键词1：12-1点钟方向（补充具体位置，不含重复的侧别和器官）\n关键词2：右乳浸润性导管癌（已含侧别\"\
            右\"和器官\"乳\"）\n \n情况2：诊断名未包含侧别（如\"乳腺浸润性导管癌\"）\n关键词1：右乳12-1点钟方向（包含侧别和具体位置）\n\
            关键词2：乳腺浸润性导管癌\n \n填充规则：\n检查诊断名是否已包含侧别和器官\n如果已包含，位置信息只补充具体位置描述\n如果未包含，位置信息需包含侧别+具体位置\n\
            按序列顺序填充存在的信息\n信息缺失则跳过\n\n【食管肿瘤疾病排序模板】\n- 仅食管肿瘤必须选择【食管肿瘤疾病排序模板】，不能选择其他任何排序模板\n\
            - 从输入的《病历信息》中提取食管肿瘤的 【距离标识】（例如距门齿 XX-YYcm、距门齿XXcm等等）、【分段标识】（例如：食管XX段）\n\
