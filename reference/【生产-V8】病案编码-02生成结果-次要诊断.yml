            3-3 乳头相关位置：（强调：需要严格遵守位置提取规则）\n乳头旁 / 乳头部：完整提取原文中直接描述与乳头位置关系的短语。\n原文：\"\
            右乳9点钟方向乳头旁\"\n正确提取：\"乳头旁\" 或 \"右乳乳头旁\"\n错误提取：拆分为\"9点钟方向\"和\"乳头旁\"，或仅保留\"\
            9点钟方向\"。\n \n原文：\"左乳头内侧缘\"\n正确提取：\"乳头内侧缘\"\n错误提取：无（此描述已足够精确）。\n原文：\"病灶位于乳头后方\"\
            \n正确提取：\"乳头后方\"\n错误提取：尝试为“后方”指定一个钟点方位（如“12点钟方向”）。\n \n距乳头距离：完整保留带单位的距离描述，这是对乳头参照关系的量化，应独立保留。\n\
            原文：\"距乳头约30mm\"\n正确提取：\"距乳头约30mm\"\n错误提取：省略距离数值或单位。\n原文：\"乳头外侧20mm处\"\n\
            正确提取：\"乳头外侧20mm处\"\n错误提取：仅保留\"外侧\"，省略距离。\n \n3-4 象限信息：如果原文明确提及则提取，不与钟点方位混淆。\n\
            正确：\"外上象限\"、\"双乳多发，分布于外上及内下象限\"\n错误：将\"外上象限\"推算为\"10-2点钟方向\"\n正确：\"右乳上部稍偏外侧区\"\
            -->\"右乳上外象限\"\n错误：将\"右乳上部稍偏外侧区\"推算为\"右乳上部\"\n \n复合方位与合并规则：\n1. 当病历中同时出现“钟点方向”与“区域描述”（如：外上、内下）时：\n\
            - 首先将钟点转换为基础方位（如右乳9点→外侧）。\n- 若区域描述包含或等于该基础方位（如“外上”包含“外”），则采纳更具体的区域描述。\n\
            - 示例：`右乳9点钟方向，病灶位于外上区域` → 钟点“外侧”被“外上”包含 → 输出“右乳外上”。\n \n1.3.4 核心原则总结\n\
            - 原文优先：所有位置描述均以原文表述为准进行提取，不进行推断、拆分或标准化转换。\n- 参照点保留：“乳头”、“乳晕”、“中央”是关键解剖参照点，必须与方位、距离同时保留。\n\
            - 信息完整：方位（钟点/象限）、参照点（乳头/中央）、距离是一个整体，共同构成“具体位置”，缺一不可。\n \n1.3.5 绝对禁止提取\n\
            - 标准化位置：乳腺上部（映射结果，非原文）\n- 不完整的位置描述（如只提取\"12-1点钟方向\"而忽略侧别）\n \n验证规则：\n\
            - 每个提取的位置信息必须能在原文中找到直接对应\n- 侧别信息必须明确提取，不能缺失\n- 完整的位置描述必须包含\"侧别+器官+具体位置\"\
            \n \n三、读取输入，原文提取 输入的《病历信息》中的【主要分布类型】；\n\n## 第二阶段：基准诊断确定\n目的：确定统一的基准诊断名称，解决系统诊断与临床诊断的差异。\n\
            \ \n### 2.1 诊断对比\n- 系统诊断：输入的主要诊断\n- 临床诊断：病历中\"出院诊断\"的第一个诊断名称\n \n### 2.2\
            \ 一致性判断标准\n高度一致（三个条件都满足）：\n1. 核心疾病实体相同\n2. 临床诊断部位精度≥系统诊断精度\n3. 病理类型一致或无冲突\n\
            \ \n不一致（任一条件满足）：\n1. 解剖部位精度倒挂（系统比临床更具体）\n2. 病理类型明确冲突\n3. 疾病类别冲突（疾病本体 vs\
            \ 治疗状态）\n \n### 2.3 基准诊断确定\n- 规则A（高度一致）：以临床诊断（出院诊断第一个）为基准\n- 规则B（不一致）：以系统诊断（输入主要诊断）为基准\n\
            \n### 2.4 位置信息矛盾处理\n当标准化位置与原文描述存在矛盾时：\n1. **如果标准化位置明显不完整**（如描述为单一部位但判定为交搭跨越）：\n\
            \   - 以原文描述为准\n   - 重新判断真实的位置范围\n   \n2. **重新判断规则**：\n   - 原文描述：\"食管胸上、中段\"\
            \ → 交搭跨越（胸上段+胸中段）\n   - 原文描述：\"食管中上段\" → 交搭跨越（胸中段+胸上段）\n   - 输出应为：\"食管胸上中段交搭跨越\"\
            \n\n## 第三阶段：诊断术语标准化\n目的：将基准诊断转换为标准ICD术语，删除非编码信息。\n \n### 3.1 标准化映射\n应用以下映射表：\n\
            【方位标准化】 【实体肿瘤标准化】\n\"右侧\" → \"右\" \"肺Ca\" → \"肺癌\"\n\"左侧\" → \"左\" \"\
            乳腺Ca\" → \"乳腺癌\"\n\"双侧\" → \"双\" \"胃Ca\" → \"胃癌\"\n\"中部\" → \"中\" \"肝Ca\"\
            \ → \"肝癌\"\n \n### 3.2 净化规则（删除项）\n删除以下非编码信息：\n- 分子标记：\"HER2+\"、\"EGFR突变\"\
