    - data:
        code: "import json\nimport re\n\ndef main(knowledges: list[object],cyzd_name:str)\
          \ -> dict:\n    icd10_results = []\n    for knowledge in knowledges:\n \
          \       content = knowledge.get('content','')\n        disease_name = re.escape(cyzd_name)\n\
          \n        # 目的是过滤无用的知识库：\n        # 查找包含\"疾病\"的完整行（包括前面的编码）\n        pattern\
          \ = f'^[^\\\\n]*{disease_name}[^\\\\n]*$'\n        result = re.findall(pattern,\
          \ content, re.MULTILINE)\n        if result:\n            icd10_results.append({\n\
          \                'content':'\\n'.join(result)\n            })\n\n\n    return\
          \ {\n        \"result\": icd10_results,\n    }\n"
